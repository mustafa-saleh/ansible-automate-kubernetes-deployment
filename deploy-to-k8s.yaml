---
- name: Deploy app in new namespace
  hosts: localhost
  vars_files:
    - project-vars
  tasks:
    - name: Create a k8s namespace
      kubernetes.core.k8s:
        name: my-app
        api_version: v1
        kind: Namespace
        state: present
    - name: Deploy nginx app 
      kubernetes.core.k8s:
        src: "{{nginx_deployment_file}}"
        state: present
        namespace: my-app
